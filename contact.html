
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strawberry Cafe | Contact</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/bootstrap.bundle.min.js"></script>
</head>

<body>

<nav class="navbar md:navbar-expand bg-1">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="index.html">
            Strawberry Cafe
        </a>

        <button class="btn-icon navbar-toggler" type="button"
                data-bs-toggle="drawer"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Open navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <dialog class="drawer drawer-end" id="navbarNav"
                aria-labelledby="navTitle">
            <div class="drawer-header">
                <h2 class="drawer-title" id="navTitle">Menu</h2>
                <button type="button" class="btn-close"
                        data-bs-dismiss="drawer"
                        aria-label="Close menu"></button>
            </div>
            <div class="drawer-body">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#desserts">
                            Desserts
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active"
                           aria-current="page"
                           href="contact.html">Contact</a>
                    </li>
                </ul>
            </div>
        </dialog>
    </div>
</nav>

<main class="container mt-5">
    <h1 class="text-center fw-bold">Contact Strawberry Cafe</h1>
    <p class="text-center">
        Have a question about our desserts? We would love to hear from you!
    </p>

    <form class="mx-auto mt-5" style="max-width: 800px">
        <div class="row g-4">

            <div class="col-12 md:col-6">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" class="form-control"
                       id="firstName" name="firstName" required>
            </div>

            <div class="col-12 md:col-6">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" class="form-control"
                       id="lastName" name="lastName" required>
            </div>

            <div class="col-12">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control"
                       id="email" name="email"
                       placeholder="name@example.com" required>
            </div>

            <div class="col-12">
                <label for="dessert" class="form-label">Favorite Dessert</label>
                <select class="form-control" id="dessert" name="dessert">
                    <option value="">Choose a dessert</option>
                    <option>Mixed Berry Tart</option>
                    <option>Strawberry Cream Puff</option>
                    <option>Chocolate Strawberry Roll</option>
                    <option>Strawberry Shortcake</option>
                    <option>Strawberry Chocolate Cake</option>
                    <option>Strawberry Pudding</option>
                </select>
            </div>

            <div class="col-12">
                <label for="message" class="form-label">Your Message</label>
                <textarea class="form-control" id="message"
                          name="message" rows="5"
                          placeholder="Write your message here..."
                          required></textarea>
            </div>

            <div class="col-12">
                <input type="checkbox" class="check"
                       id="consent" name="consent" required>
                <label for="consent">
                    I agree to be contacted by Strawberry Cafe.
                </label>
            </div>

        </div>

        <button type="submit" class="btn-solid theme-primary mt-4">
            Send Message
        </button> 
    </form>
</main>

<footer class="container text-center my-5">
    <p>© 2026 Strawberry Cafe Collection.</p>
    <p>Made with love and strawberries.</p>
</footer>

</body>
</html>
